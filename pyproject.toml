[project]
name = "killpoint"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "haotian-zz", email = "44010427+haotian-zz@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dbos>=3.6.0",
    "hypercorn>=0.18.0",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-postgres>=3.2.1",
    "psycopg[binary,pool]>=3.3.9",
    "restate-sdk>=1.5.4",
    "temporalio>=1.36.1",
]

[project.scripts]
killpoint = "killpoint.cli:main"

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
